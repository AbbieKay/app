<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-800 text-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-400">Admin Dashboard</h1>
            <a href="index.html" class="text-sm text-gray-400 hover:text-emerald-400">Back to Viewer</a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- LEFT COLUMN: Menu Management -->
            <div class="space-y-8">
                <!-- Add Item Form -->
                <div class="bg-gray-700 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl font-semibold mb-4 text-emerald-400">Add Menu Item</h2>
                    <form id="addItemForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Category (Type new or select existing)</label>
                            <!-- Changed to text input with datalist for dynamic categories -->
                            <input type="text" id="category" list="categoryList" required 
                                   class="w-full bg-gray-600 border border-gray-500 rounded-md px-3 py-2 focus:ring-emerald-500 focus:border-emerald-500" 
                                   placeholder="e.g., Food, Meat, Accompaniments">
                            <datalist id="categoryList"></datalist>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Item Name</label>
                            <input type="text" id="itemName" required class="w-full bg-gray-600 border border-gray-500 rounded-md px-3 py-2 focus:ring-emerald-500">
                        </div>
                        <button type="submit" class="w-full bg-emerald-500 text-white py-2 px-4 rounded-md hover:bg-emerald-600 transition">Add to Menu</button>
                    </form>
                </div>

                <!-- NEW: Current Menu Display -->
                <div class="bg-gray-700 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl font-semibold mb-4 text-emerald-400">Current Menu</h2>
                    <div class="overflow-y-auto max-h-96">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-600 sticky top-0">
                                <tr>
                                    <th class="p-2">Category</th>
                                    <th class="p-2">Item Name</th>
                                    <th class="p-2 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="menuTableBody">
                                <tr><td colspan="3" class="p-4 text-center text-gray-400">No items yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Votes -->
            <div>
                <div class="bg-gray-700 p-6 rounded-lg shadow-lg">
                    <h2 class="text-xl font-semibold mb-4 text-emerald-400">Who Chose What</h2>
                    <div class="overflow-y-auto max-h-[500px]">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-600 sticky top-0">
                                <tr>
                                    <th class="p-2">Guest</th>
                                    <th class="p-2">Category</th>
                                    <th class="p-2">Choice</th>
                                </tr>
                            </thead>
                            <tbody id="votesTableBody">
                                <tr><td colspan="3" class="p-4 text-center text-gray-400">Waiting for votes...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        // PASTE YOUR ACTUAL FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Handle Adding Items
        document.getElementById('addItemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const category = document.getElementById('category').value;
            const name = document.getElementById('itemName').value;

            db.collection("menu_items").add({
                category: category,
                name: name
            }).then(() => {
                e.target.reset();
            });
        });

        // 2. Listen for Menu Items (Updates Menu Table & Category Datalist)
        db.collection("menu_items").onSnapshot((snapshot) => {
            // Update the category datalist so admin can see existing categories
            const categories = [...new Set(snapshot.docs.map(doc => doc.data().category))];
            const datalist = document.getElementById('categoryList');
            datalist.innerHTML = categories.map(cat => `<option value="${cat}">`).join('');

            // Update the Current Menu table
            const tbody = document.getElementById('menuTableBody');
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400">No items yet.</td></tr>';
                return;
            }

            let html = '';
            snapshot.docs.forEach(doc => {
                const data = doc.data();
                html += `
                    <tr class="border-b border-gray-600 hover:bg-gray-600">
                        <td class="p-2 text-gray-400">${data.category}</td>
                        <td class="p-2 font-medium">${data.name}</td>
                        <td class="p-2 text-right">
                            <button onclick="deleteItem('${doc.id}')" class="text-red-400 hover:text-red-300 font-semibold">Delete</button>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        });

        // 3. Delete Item Function
        window.deleteItem = function(itemId) {
            if (confirm("Are you sure you want to delete this item from the menu?")) {
                db.collection("menu_items").doc(itemId).delete();
            }
        }

        // 4. Listen for Votes in Real-Time
        db.collection("votes").onSnapshot((snapshot) => {
            const tbody = document.getElementById('votesTableBody');
            let html = '';
            
            const docs = snapshot.docs.reverse(); 
            
            if (docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-400">No votes yet.</td></tr>';
                return;
            }

            docs.forEach(doc => {
                const data = doc.data();
                html += `
                    <tr class="border-b border-gray-600 hover:bg-gray-600">
                        <td class="p-2 font-medium">${data.userName}</td>
                        <td class="p-2 text-gray-400">${data.category}</td>
                        <td class="p-2 text-emerald-300">${data.itemName}</td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        });
    </script>
</body>
</html>
