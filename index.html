<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Menu - Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700">Event Menu</h1>
            <a href="admin.html" class="text-sm text-gray-500 hover:text-indigo-600">Admin Login</a>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-2">Make Your Choices</h2>
            <p class="text-sm text-gray-500 mb-4">Select one item from each category you would like.</p>
            
            <form id="voteForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                    <input type="text" id="userName" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <!-- Menu categories will be injected here -->
                <div id="menuContainer" class="space-y-6">
                    <p class="text-gray-500">Loading menu...</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-3 px-4 rounded-md hover:bg-indigo-700 transition font-semibold text-lg mt-6">
                    Submit All Choices
                </button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Current Standings</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b-2 border-gray-200">
                        <th class="py-2">Category</th>
                        <th class="py-2">Item</th>
                        <th class="py-2 text-right">Votes</th>
                    </tr>
                </thead>
                <tbody id="standingsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        // PASTE YOUR ACTUAL FIREBASE CONFIG HERE
          const firebaseConfig = {
    apiKey: "AIzaSyAI6Mpu88nT258zMcZ5l4abAWCizcaamr8",
    authDomain: "menu-app-91eb7.firebaseapp.com",
    projectId: "menu-app-91eb7",
    storageBucket: "menu-app-91eb7.firebasestorage.app",
    messagingSenderId: "710690718340",
    appId: "1:710690718340:web:6a235d01ce130f5398f8d1",
    measurementId: "G-8E3PEBVL6N"

        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentItems = [];
        let currentVotes = [];

        // 1. Listen for Menu Items in Real-Time
        db.collection("menu_items").onSnapshot((snapshot) => {
            currentItems = [];
            snapshot.forEach(doc => currentItems.push({ id: doc.id, ...doc.data() }));
            renderMenu();
            renderStandings();
        });

        // 2. Listen for Votes in Real-Time
        db.collection("votes").onSnapshot((snapshot) => {
            currentVotes = [];
            snapshot.forEach(doc => currentVotes.push(doc.data()));
            renderStandings();
        });

        // 3. Render the Menu grouped by DYNAMIC categories
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (currentItems.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No items on the menu yet. Ask the admin to add some!</p>';
                return;
            }

            // Get unique categories and sort them alphabetically
            const categories = [...new Set(currentItems.map(item => item.category))].sort();
            let html = '';
            
            categories.forEach(cat => {
                const catItems = currentItems.filter(i => i.category === cat);
                if (catItems.length > 0) {
                    // Sanitize category name so it works safely in HTML input 'name' attributes
                    const safeCatName = cat.replace(/[^a-zA-Z0-9]/g, '_');
                    
                    html += `
                        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                            <h3 class="font-bold text-lg text-indigo-600 mb-3 border-b pb-2">${cat}</h3>
                            <div class="space-y-2">
                    `;
                    catItems.forEach(item => {
                        // Notice the name attribute is now unique per category: name="choice_CategoryName"
                        html += `
                            <label class="flex items-center space-x-3 p-2 hover:bg-white rounded cursor-pointer transition">
                                <input type="radio" name="choice_${safeCatName}" value="${item.id}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                                <span class="text-gray-700">${item.name}</span>
                            </label>`;
                    });
                    html += `</div></div>`;
                }
            });
            container.innerHTML = html;
        }

        // 4. Render the Standings Table
        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            let html = '';
            
            currentItems.forEach(item => {
                const voteCount = currentVotes.filter(v => v.itemId === item.id).length;
                html += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-2 text-gray-500">${item.category}</td>
                        <td class="py-2 font-medium">${item.name}</td>
                        <td class="py-2 text-right font-bold text-indigo-600">${voteCount}</td>
                    </tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="3" class="py-4 text-center text-gray-500">No data yet.</td></tr>';
        }

        // 5. Handle Multiple Choice Submission
        document.getElementById('voteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userName = document.getElementById('userName').value.trim();
            
            if (!userName) return alert("Please enter your name!");

            // Find ALL checked radio buttons across all categories
            const checkedInputs = document.querySelectorAll('input[type="radio"]:checked');
            
            if (checkedInputs.length === 0) {
                return alert("Please select at least one item from the menu!");
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            try {
                // Create an array of promises for Firebase writes
                const promises = [];
                
                checkedInputs.forEach(input => {
                    const itemData = currentItems.find(i => i.id === input.value);
                    if (itemData) {
                        promises.push(db.collection("votes").add({
                            userName: userName,
                            itemId: itemData.id,
                            itemName: itemData.name,
                            category: itemData.category,
                            timestamp: new Date()
                        }));
                    }
                });

                // Wait for all selected items to be saved to Firebase simultaneously
                await Promise.all(promises);
                
                alert("Your choices have been submitted successfully!");
                e.target.reset(); // Clears the form and unchecks all radio buttons
            } catch (error) {
                console.error("Error submitting votes: ", error);
                alert("There was an error submitting your choices. Please try again.");
            } finally {
                // Re-enable the button no matter what happens
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit All Choices";
            }
        });
    </script>
</body>
</html>
